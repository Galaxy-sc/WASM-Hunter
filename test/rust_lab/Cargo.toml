[package]
name = "rust_lab"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 'z'     # فشرده‌سازی برای کاهش حجم
lto = true          # Link Time Optimization (حذف کدهای اضافی)
strip = true        # حذف Symbolها و دیباگ‌داتا
panic = 'abort'     # حذف کدهای مربوط به هندلینگ ارور

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }